name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'dev-*'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Backend CI: Build, Lint, Unit Tests, and E2E Tests with PostgreSQL
  # ============================================================================
  backend-ci:
    name: Backend (NestJS + Prisma)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eticket
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eticket?schema=public
      PORT: 4000
      NODE_ENV: test
      API_PREFIX: api/v1
      CORS_ORIGIN: "*"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Build backend application
        working-directory: backend
        run: npm run build

      - name: Run unit tests
        working-directory: backend
        run: npm test

      - name: Apply Prisma database migrations
        working-directory: backend
        run: npx prisma db push

      - name: Run E2E tests against PostgreSQL
        working-directory: backend
        run: npm run test:e2e

  # ============================================================================
  # Frontend CI: Typecheck and Production Build
  # ============================================================================
  frontend-ci:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend application
        working-directory: frontend
        run: npm run build

  # ============================================================================
  # Docker CI: Image Builds and Full-Stack Compose Validation
  # ============================================================================
  docker-ci:
    name: Docker & Compose Integration
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose syntax
        run: docker compose config

      - name: Build Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: eticket-backend:ci

      - name: Build Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: eticket-frontend:ci

      - name: Start full application stack with Docker Compose
        run: |
          docker compose up -d --build
          echo "Waiting for services to become healthy..."
          sleep 15

      - name: Verify Backend health check endpoint
        run: |
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:4000/health

      - name: Verify Frontend service
        run: |
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:3000/

      - name: Verify Nginx reverse proxy routing
        run: |
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:3000/health

      - name: Teardown Docker Compose stack
        if: always()
        run: docker compose down -v
