# Development Compose Configuration with live code reload
# Usage: docker compose -f docker-compose.dev.yml up

services:
  postgres:
    image: postgres:16-alpine
    container_name: eticket-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-eticket}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - eticket_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-eticket}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eticket-dev-network

  backend:
    image: node:20-alpine
    container_name: eticket-backend-dev
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: 4000
      API_PREFIX: api/v1
      CORS_ORIGIN: "*"
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-eticket}?schema=public"
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "apk add --no-cache openssl && npm install && npx prisma generate && npx prisma db push && npm run start:dev"
    networks:
      - eticket-dev-network

  frontend:
    image: node:20-alpine
    container_name: eticket-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - eticket-dev-network

networks:
  eticket-dev-network:
    name: eticket-dev-network
    driver: bridge

volumes:
  eticket_postgres_dev_data:
    name: eticket_postgres_dev_data
    driver: local
